name: Claude Code Review

# Automatic Claude review on every PR (opened / new commits). Posts feedback as a
# PR comment using the repo's CLAUDE.md (if present). Requires the Claude GitHub
# App + the CLAUDE_CODE_OAUTH_TOKEN repo secret.

on:
  pull_request:
    types: [opened, synchronize]   # review on open + every new commit

concurrency:
  group: 'claude-review-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip fork PRs: they don't receive repo secrets, so the run would fail.
    # Skip PRs labeled 'trivial': the fleet's review opt-out tier.
    # Skip dependabot PRs: same root cause as forks -- they run without access to
    # repo secrets, so CLAUDE_CODE_OAUTH_TOKEN resolves empty and the action fails
    # with a red `claude-review` check on every dependency bump. semgrep.yml already
    # carries this guard; this keeps the two consistent.
    if: >
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.fork == false && !contains(github.event.pull_request.labels.*.name, 'trivial')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # the deterministic marker step posts the verdict comment
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@e90deca47693f9457b72f2b53c17d7c445a87342 # v1
        env:
          GH_TOKEN: ${{ github.token }}   # read-only gh commands (pr diff/view) need auth
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md (if present) for style and conventions.
            Be constructive and concise; skip purely stylistic nits.

            Your structured output is the ONLY channel for your verdict — you
            have no comment-writing access, and a later deterministic step posts
            the verdict from it. Set no_major_issues to true ONLY if your review
            raised no blocking or major findings; when false, also set
            highest_severity and a one-line verdict_summary naming the worst
            finding. Your full review text is preserved in this workflow's log.

          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
            --json-schema '{"type":"object","properties":{"no_major_issues":{"type":"boolean"},"highest_severity":{"type":"string","enum":["critical","major","minor"]},"verdict_summary":{"type":"string"}},"required":["no_major_issues"]}'

      - name: Post exact-head verdict marker
        # The review-pipeline Stage 2 watcher fail-closes the Claude reviewer
        # slot unless an issue comment carries the literal marker
        # <!-- review-pipeline: reviewer=claude head=<sha> --> plus a
        # clean-phrase or severity-prefixed verdict line. Build that comment
        # deterministically from the schema-validated structured output — never
        # from model-authored free text, and never by the model itself: the
        # model's allowedTools above contain no write-capable command, so this
        # step is the only path to the trusted comment. If the model produced
        # no structured output, or this step fails, no marker is posted and the
        # watcher stays fail-closed (unverified), which is the safe direction.
        #
        # Contradiction clamps (fail closed, both directions):
        #  - no_major_issues=true with highest_severity critical/major is a
        #    contradiction; the clean line is NOT posted.
        #  - no_major_issues=false with highest_severity minor contradicts the
        #    boolean's definition (a blocking or major finding exists); the
        #    severity is clamped up to major so Stage 2 cannot read a
        #    merge-blocking verdict as a nit.
        if: steps.claude-review.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STRUCTURED_OUTPUT: ${{ steps.claude-review.outputs.structured_output }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The trusted comment is 100% deterministic text. verdict_summary is
          # model-controlled and deliberately NEVER reaches it — the findings
          # and summary live in this workflow's log. The only model influence
          # on the comment is one schema-validated boolean and a clamped enum.
          clean="$(printf '%s' "$STRUCTURED_OUTPUT" | jq -r '.no_major_issues')"
          sev="$(printf '%s' "$STRUCTURED_OUTPUT" | jq -r '.highest_severity // ""')"
          if [ "$clean" = "true" ] && { [ "$sev" = "critical" ] || [ "$sev" = "major" ]; }; then
            line1="${sev^}: contradictory structured verdict (no_major_issues=true with highest_severity=${sev}); treating as not clean — see workflow log"
          elif [ "$clean" = "true" ]; then
            line1="No major issues found."
          else
            case "$sev" in
              critical|major) ;;
              *) sev="major" ;;
            esac
            line1="${sev^}: see workflow log for findings"
          fi
          body="$(printf '%s\n%s' "$line1" "<!-- review-pipeline: reviewer=claude head=${HEAD_SHA} -->")"
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body"
