name: Tests

# Runs unit tests on every push and PR.
#
# Security posture:
# - Zero github.event.* interpolation (no command-injection vectors).
# - Only matrix.python-version is templated — defined statically below.
# - permissions: contents: read (least privilege).
# - No secrets are referenced.
#
# Why Ubuntu (not macOS): the four mcp_server test files (test_redact.py,
# test_session_mgmt.py, test_agent_research.py, test_local_delegate.py)
# share a stub-import harness that stubs out mcp, openai, google.auth, and
# Keychain via subprocess.run mocks, so they're portable. mcp_server.py at
# runtime is macOS-targeted (Keychain + fcntl with POSIX fallback), but the
# test suite is platform-agnostic. test_queue_server.py (the durable
# delegate queue service) mocks its keychain read the same way and binds
# only loopback ports, but needs a REAL cryptography (AES-GCM round-trips
# are meaningless against a stub) — hence --with cryptography below.
#
# The coding_agent suite added below is native Linux syscalls (dir_fd,
# O_NOFOLLOW, os.geteuid) and portable by construction, so it runs on the
# same runner with no extra work.
#
# Every coding_agent test file runs here, including the two whose names
# suggest they cannot. What needs a built `ai-tools-coding-agent:latest`
# image (git/python/uv/pytest baked in), which no GitHub runner has, is not
# either FILE but two CLASSES: test_coding_agent_sandbox.py's
# RealContainerLifecycle and test_coding_agent_integration.py's
# DockerIntegration. Each carries a class-level `@unittest.skipIf` fed by a
# module-level `docker version` / `docker image inspect` probe, so both skip
# cleanly on a runner with no daemon.
#
# Those classes are NOT the whole of either file, which is why both files are
# in the pytest list below. Measured with no daemon reachable: 26 passed,
# 14 skipped. Among the 26 are DockerArgvIsExactlyTheSpec — which pins the
# container's confinement flags (`--network=none`, `--read-only`, `--user`,
# `--cap-drop=ALL`) argument for argument — and NoHostGitEverRunsInTheWorktree,
# the §6.5 host-RCE control. The safety case for this tool rests on exactly
# those assertions, so they run in CI rather than only on a developer machine
# that happens to have Docker up.
#
# Permission-dependent coding_agent tests (chmod-000/0644 preconditions in
# test_coding_agent_security.py and test_coding_agent_walk_dirrefusal.py) are
# individually `@unittest.skipIf(os.geteuid() == 0, ...)` guarded, because
# root bypasses directory read/exec checks and the precondition those tests
# build cannot occur under it. GitHub-hosted runners execute as a non-root
# user, so in ordinary CI these guards are a no-op; they only activate for
# someone running the suite as root (e.g. inside an unprivileged-less
# container), which is exactly the case they exist to keep honest.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run on the same ref when a new commit lands.
# Saves CI minutes on rapid push sequences (e.g., reviewer fix-ups) and
# means each PR only ever has one current run reflected in its checks.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # SHA-pin third-party actions (defense against tag-hijacking attacks
      # where a maintainer's tag is moved to point at malicious code).
      # persist-credentials: false prevents the auto-checked-out GITHUB_TOKEN
      # from sitting in .git/config across subsequent steps — we only need
      # checkout for read, never for push, so leaving the token attached is
      # gratuitous attack surface.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Install uv
        # Pinned to a SHA (v5) and to a specific uv version for fully
        # deterministic CI: failures must be attributable to repo changes,
        # never to an upstream uv release that landed between two of our runs.
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081  # v5
        with:
          version: "0.11.16"

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Run unit tests
        # Test stubs (_build_stub_modules in both test_redact.py and
        # test_session_mgmt.py) cover every module-level import in
        # mcp_server.py: openai, mcp.*, google.auth.*, and httpx. Each file
        # scopes its stubs via mock.patch.dict(sys.modules, ...) so they
        # don't leak across files — results are order-independent. pytest
        # is the only real dependency CI needs for the mcp_server files —
        # no transitive httpx/requests install; cryptography is installed
        # solely for test_queue_server.py's real AES-GCM round-trips.
        # Adding a new module-level import to mcp_server.py means
        # extending the stubs in ALL FOUR mcp_server test files, not
        # patching this workflow.
        #
        # `--with pathspec` and `--with pytest-timeout` are added ONLY for
        # the coding_agent files below, which are the only ones that need
        # them: `coding_agent/basetree.py` parses .gitignore patterns via
        # `pathspec` (a real runtime dependency of the package, not test-only
        # — see the PEP 723 block), and two coding_agent regression tests
        # signal a broken guard by HANGING rather than failing red (see
        # test_coding_agent_walk_dirrefusal.py and
        # test_coding_agent_sandbox.py); pytest-timeout turns that hang into
        # a red failure instead of a stuck CI job. Everything else in this
        # command runs exactly as before without either package.
        run: uv run --with pytest --with cryptography --with pathspec --with pytest-timeout pytest test_redact.py test_session_mgmt.py test_agent_research.py test_local_delegate.py test_queue_server.py test_coding_agent_displacement.py test_coding_agent_encoding.py test_coding_agent_integration.py test_coding_agent_loop.py test_coding_agent_mcp.py test_coding_agent_sandbox.py test_coding_agent_security.py test_coding_agent_tools.py test_coding_agent_walk.py test_coding_agent_walk_dirrefusal.py -q

      - name: Ruff format check
        run: uv tool run --from ruff==0.16.1 ruff format --check mcp_server.py queue_server.py test_redact.py test_session_mgmt.py test_agent_research.py test_local_delegate.py test_queue_server.py coding_agent/*.py test_coding_agent_displacement.py test_coding_agent_encoding.py test_coding_agent_integration.py test_coding_agent_loop.py test_coding_agent_mcp.py test_coding_agent_sandbox.py test_coding_agent_security.py test_coding_agent_tools.py test_coding_agent_walk.py test_coding_agent_walk_dirrefusal.py

      - name: Ruff lint check
        run: uv tool run --from ruff==0.16.1 ruff check .

  prerelease-guard:
    # The UV_PRERELEASE=if-necessary pin is duplicated across
    # every launch/check surface by necessity (uv config discovery is
    # cwd-based and uv.toml has no include mechanism — see uv.toml's
    # comments), so there is no single source of truth. This job turns the
    # "update all copies together" convention documented in AGENTS.md into
    # an enforced invariant: a future edit that drops or changes the pin on
    # only some surfaces fails CI instead of drifting silently.
    name: prerelease policy pin check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Verify UV_PRERELEASE pins on all launch surfaces
        run: |
          set -euo pipefail
          PIN='UV_PRERELEASE["=: ]+["]?if-necessary'
          fail=0

          # file:minimum-occurrences — install.sh has two call sites
          # (the generated server entry and the post-install --check).
          # README.md carries four documented examples (two claude-mcp-add
          # one-liners, the macOS multiline form, and the JSON snippet) —
          # copy-paste sources for real launch configs, so they're held to
          # the same invariant as the executable surfaces.
          for spec in .mcp.json:1 mcpb/manifest.json:1 hooks/preflight.sh:1 install.sh:2 README.md:4; do
            file="${spec%:*}"; want="${spec#*:}"
            # A renamed/deleted surface must FAIL loudly. Without this
            # guard, grep on a missing file yields got="" and the
            # integer test errors — which an if-condition treats as
            # false, silently taking the ok branch.
            if [ ! -f "$file" ]; then
              echo "FAIL: $file is missing — renamed or deleted? Update this check alongside the move."
              fail=1
              continue
            fi
            got=$(grep -Ec "$PIN" "$file" || true)
            : "${got:=0}"  # any other grep failure counts as zero pins
            if [ "$got" -lt "$want" ]; then
              echo "FAIL: $file has $got pin(s), expected >= $want"
              fail=1
            else
              echo "ok: $file ($got pin(s))"
            fi
          done

          # The delegate-queue LaunchAgent plist is a launch surface too,
          # but plist XML splits key and value across lines
          # (<key>UV_PRERELEASE</key> / <string>if-necessary</string>),
          # so the single-line pattern above cannot see it.
          plist='deploy/jvmbpro-delegate-queue/com.jasonvassallo.delegate-queue.plist'
          if [ ! -f "$plist" ]; then
            echo "FAIL: $plist is missing — renamed or deleted? Update this check alongside the move."
            fail=1
          elif grep -A1 '<key>UV_PRERELEASE</key>' "$plist" | grep -q '<string>if-necessary</string>'; then
            echo "ok: $plist (1 pin)"
          else
            echo "FAIL: $plist is missing the UV_PRERELEASE=if-necessary pin"
            fail=1
          fi

          # Repo-cwd runs are covered by uv.toml rather than an env pin.
          if grep -q '^prerelease = "if-necessary"$' uv.toml; then
            echo "ok: uv.toml policy line present"
          else
            echo "FAIL: uv.toml is missing the prerelease policy line"
            fail=1
          fi

          exit "$fail"
